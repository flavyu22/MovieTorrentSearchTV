name: Signed draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the app versionName in app/build.gradle.kts (for example v2.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      UPDATE_MANIFEST_URL: ${{ vars.UPDATE_MANIFEST_URL }}
      UPDATE_REPOSITORY: ${{ github.repository }}
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@7a445ee88d4e23b52c33d2f006e55e1ad8c1c3a8 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v4
      - name: Restore protected signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - name: Verify repository
        run: python3 scripts/verify-project.py
      - name: Validate and build Play plus Direct releases
        run: |
          ./gradlew \
            :app:validateProductionConfiguration \
            :app:validateDirectProductionConfiguration \
            :app:assemblePlayRelease \
            :app:generateUpdateManifest \
            --stacktrace
      - name: Create checksum files
        run: |
          mkdir -p app/build/release
          sha256sum app/build/outputs/apk/play/release/app-play-release.apk > app/build/release/app-play-release.apk.sha256
          sha256sum app/build/outputs/apk/direct/release/app-direct-release.apk > app/build/release/app-direct-release.apk.sha256
      - name: Create signed draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXPECTED_TAG="v$(sed -n 's/^val appVersionName = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          if [[ -z "$EXPECTED_TAG" || "$EXPECTED_TAG" == "v" ]]; then
            echo "Unable to read appVersionName from app/build.gradle.kts" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "This source revision requires RELEASE_TAG=$EXPECTED_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/play/release/app-play-release.apk \
            app/build/release/app-play-release.apk.sha256 \
            app/build/outputs/apk/direct/release/app-direct-release.apk \
            app/build/release/app-direct-release.apk.sha256 \
            app/build/release/update.json \
            --draft --generate-notes --title "$RELEASE_TAG"
