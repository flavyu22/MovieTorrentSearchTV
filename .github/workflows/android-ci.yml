name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@7a445ee88d4e23b52c33d2f006e55e1ad8c1c3a8 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4
      - name: Verify repository guardrails
        run: python3 scripts/verify-project.py
      - name: Test both distributions
        run: ./gradlew :app:testDirectDebugUnitTest :app:testPlayDebugUnitTest --stacktrace
      - name: Lint both distributions
        run: ./gradlew :app:lintDirectDebug :app:lintPlayDebug --stacktrace
      - name: Assemble application and benchmark variants
        run: |
          ./gradlew \
            :app:assembleDirectDebug :app:assemblePlayDebug \
            :app:assembleDirectRelease :app:assemblePlayRelease \
            :benchmark:assembleDirectBenchmark :benchmark:assemblePlayBenchmark \
            --stacktrace
      - name: Generate dependency SBOM
        if: always()
        run: python3 scripts/generate-sbom.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-diagnostics
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.sarif
            build/reports/sbom.cdx.json
