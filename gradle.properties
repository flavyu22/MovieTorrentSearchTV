# Keep the daemon within the memory available on standard CI runners.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Disabled so changes to local.properties/TMDB_API_KEY are always read on the next build.
org.gradle.configuration-cache=false
# Reuse the configuration cache's warm state between builds where possible and keep the
# VFS watching so incremental builds do not re-stat the whole source tree.
org.gradle.vfs.watch=true

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=false
# Kotlin incremental compilation: without it every build recompiles the whole module,
# which is very noticeable on this project's ~60 Kotlin sources.
kotlin.incremental=true


# Secrets and release endpoints must be supplied through environment variables or
# ~/.gradle/gradle.properties. Never place real values in this repository.
# TMDB_API_KEY=
# UPDATE_MANIFEST_URL=
# UPDATE_REPOSITORY=

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
