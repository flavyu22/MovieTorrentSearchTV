# Keep the daemon within the memory available on standard CI runners.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Disabled so changes to local.properties/TMDB_API_KEY are always read on the next build.
org.gradle.configuration-cache=false

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=false


# Secrets and release endpoints must be supplied through environment variables or
# ~/.gradle/gradle.properties. Never place real values in this repository.
# TMDB_API_KEY=
# UPDATE_MANIFEST_URL=
# UPDATE_REPOSITORY=

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
